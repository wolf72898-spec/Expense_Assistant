# Financial credential (票据) model — field-by-field layer map
#
# Evidence.credential in report.json (schema $defs.FinancialCredential) holds the 票据 itself; item fields hold the claim.
# Layers:
#   national   — aligned by element name to GB/T 42965.1-2023 (基本要素) / GB/T 42965.2-2023 (特定要素) and the MOF
#                电子凭证会计数据标准. Element identifiers, lengths and code lists must be confirmed against the standard
#                text before this map is used for data interchange (the published texts were not machine-readable here).
#   provenance — how the credential was obtained (trust: xml 4 > ofd 3 > pdf 2 > image/paper 1)
#   inferred   — derived by the agent / engine, never printed on the voucher
#   enterprise — company-specific (org pack); lives on the item or report, never inside the credential (keeps the national core clean)
#   excluded   — present on some vouchers but never captured (privacy)
standards:
  - {code: "GB/T 42965.1-2023", title: 电子发票业务数据规范 第1部分：基本要素, status: 现行, effective: 2023-08-06}
  - {code: "GB/T 42965.2-2023", title: 电子发票业务数据规范 第2部分：特定要素, status: 现行}
  - {code: 电子凭证会计数据标准（推广应用版）, issuer: 财政部}

national:
  identity.invoice_number:      {element: 发票号码}
  identity.invoice_code:        {element: 发票代码, note: 税控发票；数电票无}
  identity.issue_date:          {element: 开票日期}
  identity.check_code:          {element: 校验码, note: 普票查验要素}
  identity.type_label:          {element: 票种 / 发票名称}
  seller.name:                  {element: 销售方名称}
  seller.taxpayer_id:           {element: 销售方统一社会信用代码/纳税人识别号}
  seller.address / seller.phone: {element: 销售方地址、电话}
  seller.bank_name / seller.bank_account: {element: 销售方开户银行、银行账号}
  buyer.name:                   {element: 购买方名称}
  buyer.taxpayer_id:            {element: 购买方统一社会信用代码/纳税人识别号}
  buyer.address / buyer.phone / buyer.bank_name / buyer.bank_account: {element: 购买方地址电话、开户行及账号, note: 专票}
  line_items[].item_name:       {element: 项目名称}
  line_items[].specification:   {element: 规格型号}
  line_items[].unit:            {element: 单位}
  line_items[].quantity:        {element: 数量}
  line_items[].unit_price:      {element: 单价}
  line_items[].amount:          {element: 金额}
  line_items[].tax_rate:        {element: 税率/征收率}
  line_items[].tax_amount:      {element: 税额}
  totals.amount_excl_tax:       {element: 合计金额}
  totals.tax_amount:            {element: 合计税额}
  totals.total_amount:          {element: 价税合计（小写）}
  totals.total_amount_words:    {element: 价税合计（大写）}
  tax.tax_method:               {element: 计税方式 / 差额征税标识}
  remarks:                      {element: 备注}
  issuer_name:                  {element: 开票人}
  special.scenario:             {element: 特定业务类型, part: 2, values: [建筑服务, 不动产销售, 不动产经营租赁服务, 代收车船税, 货物运输服务, 旅客运输服务, 通行费, 航空旅客运输服务, 铁路旅客运输服务, 差额征税]}
  special.elements (铁路旅客运输服务): {traveler_name: 旅客姓名, travel_date: 乘车日期, departure: 出发站, destination: 到达站, carrier_no: 车次, seat_class: 席别}
  special.elements (航空旅客运输服务): {traveler_name: 旅客姓名, travel_date: 乘机日期, departure: 出发地, destination: 到达地, carrier_no: 航班号, seat_class: 舱位等级, ticket_number: 电子客票号码}
  special.elements (旅客运输服务):     {traveler_name: 出行人, travel_date: 出行日期, departure: 出发地, destination: 到达地, vehicle_type: 交通工具类型, seat_class: 等级}
  special.elements (通行费):           {plate_number: 车牌号, travel_date: 通行日期}
  special.elements (不动产经营租赁服务): {property_address: 不动产地址, lease_period: 租赁期起止}

international:   # foreign invoices, receipts, paper 小票, card slips — lighter core, no national standard
  identity.receipt_number:  {note: invoice / receipt no. when printed}
  identity.issue_date:      {note: date on the voucher}
  seller.name / seller.country / seller.taxpayer_id: {note: merchant; VAT / GST registration when printed}
  totals.total_amount / totals.currency / totals.tax_amount / totals.tip: {note: original currency, never converted here}
  tax.tax_scheme:           {values: [vat, gst, sales_tax, none, other]}
  payment.method / payment.card_last4 / payment.paid_at: {note: card slip — last 4 digits only}

provenance:
  source.format:            [xml, ofd, pdf, email_html, image, paper, other]
  source.trust_rank:        "xml 4 · ofd 3 · pdf 2 · image/paper 1 — the highest-ranked representation of an invoice number is authoritative"
  source.extraction_method: [xml, ofd_structured, pdf_text, ocr, manual]
  source.digital_signature: [present_valid, present_unverified, absent, unknown]
  source.authoritative:     set by the engine among credentials sharing one invoice number
  Evidence.sha256 / Evidence.source_form: file hash; original e-invoice file vs scan / photo / non-source PDF

inferred:
  credential_class:         exp:DigitalInvoice … exp:OtherReceipt (from voucher kind / invoice type when not stated)
  jurisdiction:             CN for Chinese classes; issuing country otherwise
  standards:                stamped from the class (Chinese classes only)
  overseas:                 foreign currency, trip.country ≠ CN or a non-CN credential

enterprise:      # company extension — on the item / report, never inside the credential
  item.invoice.bip:         e-invoice system 查验结果 / 保存状态 / 报账状态 / 发票明细 / 转移 (org receipt rules)
  item.invoice.summary_name: 摘要名称 (org summary_name rule)
  item.accounting:          project / charge code / budget / 会计科目 (rule set, Chart of Accounts)
  report.rule_set:          standard / gm / vp (+ exception approval)
  report.workflow:          BIP / OA submission steps
  policy.invoice_titles:    registered 发票抬头 / 税务组织 (org invoice_title rule)

excluded:
  [证件号码, 身份证号, 身份证件号码, passport number]   # dropped by `pkg credential` before anything is written

rule_layers:     # validation order: national → company → expense policy
  national:  [CR-CN-CORE, CR-CN-CORE-CODE, CR-CN-SPECIAL-BUYER, CR-CN-RAIL, CR-CN-AIR, CR-CN-TOLL, CR-FOREIGN-CORE, CR-SUM-TAX, CR-SUM-LINES, CR-CLAIM-TOTAL, CR-ID-MATCH]   # core R-box
  company:   [ORG-CRED-ACCEPT, EX-* (example pack) / your company's receipt rules]                                                                               # org R-box
  policy:    [ORG-FLD-*, ORG-EVD-*, ORG-CAP-*, rule-set overrides <id>@gm / <id>@vp]                                             # org R-box (+ rule sets)
